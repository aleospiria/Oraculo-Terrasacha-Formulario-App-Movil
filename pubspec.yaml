name: capturador_datos_offline
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  path: ^1.8.3

  amplify_flutter: ^2.0.0
  amplify_api: ^2.0.0
  amplify_datastore: ^2.0.0
  amplify_secure_storage: ^0.5.16
  amplify_auth_cognito: ^2.0.0

  just_audio: ^0.9.39
  audio_session: ^0.1.21
  record: ^6.2.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  pdf: ^3.12.0
  printing: ^5.14.3
  signature: ^6.3.0
  image_picker: ^1.2.3
  geolocator: ^13.0.2
  crypto: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2
  # Transcripción de voz a texto 100% offline (modelo Vosk descargado una
  # sola vez y cacheado en el dispositivo). Se usa vosk_flutter_service en
  # vez de vosk_flutter porque este último no soporta iOS.
  # IMPORTANTE: Android ya incluye el binario nativo vía Gradle (AAR de
  # com.alphacephei:vosk-android), no requiere pasos adicionales. Para
  # iOS/macOS/Linux/Windows hay que instalar el binario nativo una vez por
  # plataforma después de "flutter pub get":
  #   dart run vosk_flutter_service install -t ios
  #   dart run vosk_flutter_service install -t windows
  vosk_flutter_service: ^0.1.2
  flutter_svg: ^2.0.17


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/Icons/app_icon_1024.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/Icons/app_icon_1024.png"
  web:
    generate: true
    image_path: "assets/Icons/app_icon_1024.png"
  windows:
    generate: true
    image_path: "assets/Icons/app_icon_1024.png"
  macos:
    generate: true
    image_path: "assets/Icons/app_icon_1024.png"

flutter:
  assets:
    - assets/Icons/logo.svg
    # favicon = referencia del isotype; app_icon_1024.png alimenta el launcher.
    - assets/Icons/favicon.ico

  fonts:
    - family: Typographica
      fonts:
        - asset: "assets/Fonts/TypoGraphica.otf"
    - family: ChampagneLimousinesBold
      fonts:
        - asset: "assets/Fonts/Champagne & Limousines.ttf"
    - family: FuturaBold
      fonts:
        - asset: "assets/Fonts/Futura Bold.otf"

  uses-material-design: true
