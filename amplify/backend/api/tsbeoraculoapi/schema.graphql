# This "input" configures a global authorization rule to enable public access to
# all models in this schema. Learn more about authorization rules here: https://docs.amplify.aws/cli/graphql/authorization-rules
input AMPLIFY { globalAuthRule: AuthRule = { allow: public } } # FOR TESTING ONLY!

## Features Implementation

type UnitOfMeasure @model {
  id: ID!
  name: String!
  abbreviation: String
  features: [Feature] @hasMany
}

type Project @model {
  id: ID!
  name: String!
  status: String!
  trees: [Tree] @hasMany
  topologies: [Topology] @hasMany
}

type Template @model {
  id: ID!
  name: String!
  description: String
  type: Int! # 1. Form
  version: String
  is_latest: Boolean!
  templateParent: Template @belongsTo # Self-referencing
  templates: [Template] @hasMany
  templateFeatures: [TemplateFeature] @hasMany
  trees: [Tree] @hasMany
}

type Tree @model {
  id: ID!
  name: String!
  are_audios_processed: Boolean
  status: String
  project: Project @belongsTo
  template: Template @belongsTo
  rawData: [RawData] @hasMany
  topologyTrees: [TopologyTree] @hasMany
}

type TemplateFeature @model {
  id: ID!
  template: Template @belongsTo
  feature: Feature @belongsTo
}

type Feature @model {
  id: ID!
  feature_type: String # variable, constant, KPI
  name: String!
  description: String
  feature_group: String
  default_value: Float
  is_float: Boolean
  unitOfMeasure: UnitOfMeasure @belongsTo
  templateFeatures: [TemplateFeature] @hasMany
  rawDatas: [RawData] @hasMany
}

type RawData @model {
  id: ID!
  name: String
  valueFloat: Float
  valueString: String
  start_date: AWSDateTime
  end_date: AWSDateTime
  feature: Feature @belongsTo
  tree: Tree @belongsTo
}

type Topology @model {
  id: ID!
  name: String!
  string_code: String
  number_code: String
  status: String
  # polygon: AWSJSON  ← comentado/quitado del schema
  project: Project @belongsTo
  topologyParent: Topology @belongsTo
  topologies: [Topology] @hasMany
  topologyTrees: [TopologyTree] @hasMany
}

type TopologyTree @model {
  id: ID!
  topology: Topology @belongsTo
  tree: Tree @belongsTo
}